# DataLens Flash — the Rust monolith (with auth inside) + the theme-fork UI + the official
# DataLens Postgres image. Two commands:
#
#   docker compose pull
#   docker compose up -d
#
# then http://localhost:8091 (admin / admin). Nothing is built locally.
name: datalens-flash

volumes:
  pg_data:

networks:
  flash:
    driver: bridge

services:
  postgres:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0
    environment:
      POSTGRES_USER: pg-user
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_MAX_CONNECTIONS: "512"
      POSTGRES_DUMP_SKIP_CONFLICT: "true"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
      PGDATA: /var/lib/postgresql/data
      TZ: Etc/UTC
      INIT_DB_AUTH: "1"
      INIT_DB_DEMO: "1"
      INIT_DB_META_MANAGER: "1"
      INIT_DB_TEMPORAL: "0"
      INIT_DEMO_DATA: "0"
      INIT_EXTERNAL_POSTGRES: "0"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg-user -d pg-us-db"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    networks: [flash]

  monolith:
    image: ghcr.io/ivan-vibe/datalens-flash-monolith:${FLASH_VERSION:-v0.1.0}
    environment:
      MONOLITH: "1"
      PUBLIC_PORT: "8099"
      POSTGRES_DSN_LIST: postgres://pg-user:postgres@postgres:5432/pg-us-db
      META_MANAGER_PG_DSN: postgres://pg-user:postgres@postgres:5432/pg-meta-manager-db
      DL_CONNECTION_HOST_MAP: postgres=postgres:5432
