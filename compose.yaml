      TOKIO_WORKER_THREADS: "7"
      TENANT_ID_OVERRIDE: common
    depends_on:
      postgres:
        condition: service_healthy
    # Lets a dataset connection reach services published on the host (e.g. ClickHouse).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "/usr/local/bin/monolith", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 16
      start_period: 20s
    restart: unless-stopped
    networks: [flash]

  ui:
    image: ghcr.io/ivan-vibe/datalens-flash-ui:${FLASH_VERSION:-v0.1.0}
    environment:
      APP_MODE: full
      APP_ENV: production
      APP_INSTALLATION: opensource
      APP_VERSION: 0.3831.0
      RELEASE_VERSION: 2.9.0
      NODE_ENV: production
      APP_PORT: "3030"
      WORKERS: "1"
      TZ: Etc/UTC
      AUTH_ENABLED: "true"
      AUTH_POLICY: required
      AUTH_SIGNUP_DISABLED: "true"
      AUTH_ENDPOINT: http://monolith:8097
      US_ENDPOINT: http://monolith:8099
      BI_DATA_ENDPOINT: http://monolith:8099
      BI_API_ENDPOINT: http://monolith:8099
      META_MANAGER_ENDPOINT: http://monolith:8099
      EXPORT_WORKBOOK_ENABLED: "true"
      UI_CORE_CDN: "false"
      APP_BUILDER_CDN: "false"
      HC: "0"
      HC_MODULES: ""
      HC_ENDPOINT: ""
      HC_PROTOCOL: ""
      YANDEX_MAP_ENABLED: "0"
      YANDEX_MAP_TOKEN: ""
